name: Sync GitHub to GitLab

on:
  push:
    branches:
      - '**'  # Matches any branch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history is available

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      #- name: Run Go Tests with Coverage
        #run: |
          #go test ./... -coverprofile=coverage.out
          #go tool cover -func=coverage.out

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:$GITLAB_TOKEN@git.gvk.idi.ntnu.no/course/prog2005/prog2005-2025-workspace/sigurdriseth/assignment-2.git
          git fetch --unshallow || true  # Avoid failing if repo is already full clone
          git push --force gitlab ${GITHUB_REF#refs/heads/}  # Push only the triggered branch